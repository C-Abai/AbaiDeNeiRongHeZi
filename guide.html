<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07c160" />
  <title>下载安装</title>
  <style>
    :root {
      --g-primary: #07c160;
      --g-primary-d: #06a653;
      --g-bg: #f2f5f8;
      --g-card: #ffffff;
      --g-text: #1f2329;
      --g-sub: #8a9099;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(160deg, #e9f7ef 0%, var(--g-bg) 45%);
      color: var(--g-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    }
    .guide-wrap { width: 100%; max-width: 420px; }
    .guide-card {
      background: var(--g-card);
      border-radius: 22px;
      padding: 34px 24px 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(7, 193, 96, 0.12);
    }
    .g-icon {
      width: 96px; height: 96px; border-radius: 22px;
      object-fit: cover; margin: 0 auto 18px; display: block;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }
    .g-title { font-size: 24px; font-weight: 700; margin: 0 0 6px; letter-spacing: .5px; }
    .g-sub { font-size: 14px; color: var(--g-sub); margin: 0 0 20px; }
    .g-intro {
      font-size: 15px; line-height: 1.75; color: #3a3f47;
      text-align: left; background: #f6f8fa; border-radius: 14px;
      padding: 16px 18px; margin: 0 0 22px; white-space: pre-wrap; word-break: break-word;
    }
    .g-btn {
      display: block; width: 100%; border: none; cursor: pointer;
      background: linear-gradient(180deg, var(--g-primary), var(--g-primary-d));
      color: #fff; font-size: 17px; font-weight: 600;
      padding: 16px; border-radius: 14px; margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(7,193,96,0.32);
      transition: transform .08s ease;
    }
    .g-btn:active { transform: scale(0.98); }
    .g-copy {
      display: block; width: 100%; border: 1px solid #d7dde3; cursor: pointer;
      background: #fff; color: #5a6470; font-size: 14px;
      padding: 12px; border-radius: 12px;
    }
    .g-tip { font-size: 13px; color: var(--g-sub); margin: 16px 0 0; line-height: 1.6; }
    .g-empty {
      text-align: center; color: var(--g-sub); padding: 40px 10px; font-size: 15px; line-height: 1.8;
    }
    .g-empty .em { font-size: 40px; display: block; margin-bottom: 12px; }
    .toast {
      position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
      background: rgba(0,0,0,0.82); color: #fff; font-size: 14px;
      padding: 10px 18px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="guide-wrap">
    <div class="guide-card" id="card">
      <div class="g-empty" id="empty"><span class="em">📦</span>引导页尚未配置<br>请在内容盒子后台「引导页」中编辑并发布</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    (function () {
      // 【v79 + v85】引导页数据源：同域优先（带门禁参数、国内快且稳）用于首屏秒开，
      // 同时后台无条件校验一次 GitHub 全量内容（长超时 + 条件请求，不阻塞首屏）。
      // v85 修复：旧版只在「同域失败」时才退到 GitHub，导致只覆盖仓库 content.json 时
      // 引导页的 apkUrl / 引导文案永远停在部署快照。旧版更早曾无超时硬拉 1.28MB 空等，
      // 现在两条链路都带超时且内容有变化才重绘，兼顾实时性与速度。
      var SC = (function () {
        try { return new URLSearchParams(location.search).get('sharecode') || 'AK6QIELR67'; }
        catch (e) { return 'AK6QIELR67'; }
      })();
      var LOCAL = './content.json?sharecode=' + encodeURIComponent(SC);
      var RAW = 'https://raw.githubusercontent.com/C-Abai/AbaiDeNeiRongHeZi/refs/heads/main/content.json';
      var CACHE_KEY = 'cb_guide_cache_v1';
      var LEN_KEY = 'cb_guide_len_v1';
      var card = document.getElementById('card');
      var toastEl = document.getElementById('toast');

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      function toast(msg) {
        toastEl.textContent = msg; toastEl.classList.add('show');
        setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
      }
      function showEmpty() {
        card.innerHTML = '<div class="g-empty"><span class="em">📦</span>引导页尚未配置<br>请在内容盒子后台「引导页」中编辑并发布</div>';
      }
      function render(c) {
        var cfg = (c && c.config) || {};
        var g = cfg.guide || {};
        if (!g.enabled) { showEmpty(); return; }
        var title = g.title || cfg.siteTitle || '下载安装';
        var sub = g.subtitle || '';
        var intro = g.intro || '';
        var icon = g.icon || cfg.icon || '';
        var apk = g.apkUrl || cfg.apkUrl || '';
        var btnText = g.buttonText || '立即下载安装';
        document.title = title;

        var html = '';
        if (icon) html += '<img class="g-icon" src="' + esc(icon) + '" alt="icon"/>';
        html += '<h1 class="g-title">' + esc(title) + '</h1>';
        if (sub) html += '<p class="g-sub">' + esc(sub) + '</p>';
        if (intro) html += '<div class="g-intro">' + esc(intro).replace(/\n/g, '<br>') + '</div>';
        if (apk) {
          html += '<button class="g-btn" id="gBtn">' + esc(btnText) + '</button>';
          html += '<button class="g-copy" id="gCopy">复制下载链接</button>';
        } else {
          html += '<div class="g-tip">尚未配置安装包链接，请联系管理员。</div>';
        }
        html += '<p class="g-tip">下载完成后，按系统提示完成安装即可使用。</p>';
        card.innerHTML = html;

        var gBtn = document.getElementById('gBtn');
        if (gBtn) gBtn.onclick = function () { location.href = apk; };
        var gCopy = document.getElementById('gCopy');
        if (gCopy) gCopy.onclick = function () {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(apk).then(function () { toast('下载链接已复制'); }, function () { toast('复制失败，请手动复制'); });
          } else { toast('当前环境不支持复制'); }
        };
      }

      // 先用本地缓存即时渲染（消除白屏），再用同域最新内容覆盖；
      // 同域失败才退到 GitHub raw，两条链路都带超时，绝不无限等待。
      function renderCached() {
        try { var s = localStorage.getItem(CACHE_KEY); if (s) { render(JSON.parse(s)); return true; } } catch (e) {}
        return false;
      }
      function cacheIt(data) {
        try {
          var raw = JSON.stringify(data);
          localStorage.setItem(CACHE_KEY, raw);
          try { localStorage.setItem(LEN_KEY, String(raw.length)); } catch (e) {}
        } catch (e) {}
      }
      function fetchT(url, opts, ms) {
        return new Promise(function (resolve, reject) {
          var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
          var timer = setTimeout(function () { if (ctl) ctl.abort(); reject(new Error('timeout')); }, ms);
          var o = Object.assign({}, opts || {});
          if (ctl) o.signal = ctl.signal;
          fetch(url, o).then(function (r) { clearTimeout(timer); resolve(r); },
                             function (e) { clearTimeout(timer); reject(e); });
        });
      }
      function loadJson(url, ms) {
        return fetchT(url + (url.indexOf('?') >= 0 ? '&' : '?') + '_h=' + Date.now(),
                      { cache: 'no-store' }, ms)
          .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); });
      }
      // 【v85】固定 URL + cache:'no-cache' 触发条件请求（内容未变时 304，几乎无流量）；
      // 超时覆盖到 body 读完，全程 fire-and-forget，绝不拖住首屏。
      function fetchGithub(ms) {
        return new Promise(function (resolve, reject) {
          var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
          var timer = setTimeout(function () { if (ctl) ctl.abort(); reject(new Error('timeout')); }, ms);
          var o = { cache: 'no-cache' };
          if (ctl) o.signal = ctl.signal;
          fetch(RAW, o).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          }).then(function (d) {
            clearTimeout(timer);
            if (!d || !d.config) throw new Error('bad payload');
            resolve(d);
          }).catch(function (e) { clearTimeout(timer); reject(e); });
        });
      }
      function init() {
        var hadCache = renderCached();
        var ghApplied = false;
        // 后台校验 GitHub 全量：只覆盖仓库 content.json 也能同步 apkUrl / 引导文案，
        // 不需要改 meta.json 指纹、也不需要重新部署。内容有变化才重绘。
        fetchGithub(20000).then(function (data) {
          ghApplied = true;
          var raw = JSON.stringify(data);
          try { if (raw === localStorage.getItem(CACHE_KEY)) return; } catch (e) {}
          cacheIt(data);
          render(data);
        }).catch(function () {});
        // 同域快渲染；GitHub 新版若已先落地，忽略随后到达的托管旧快照，避免内容被冲回旧版。
        loadJson(LOCAL, 6000)
          .then(function (data) {
            if (!data || !data.config) return Promise.reject(new Error('bad payload'));
            if (ghApplied) return;
            cacheIt(data);
            render(data);
          })
          .catch(function () { if (!hadCache) showEmpty(); });
      }
      init();
    })();
  </script>
</body>
</html>
